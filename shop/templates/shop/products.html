{% extends 'shop/base.html' %}

{% block content %}
<h2 class="featured-title" style="text-align:center;">Products</h2>

<div class="products-grid">
    {% for item in items %}
        <a href="{% url 'product_detail' item.pk %}" style="text-decoration:none;color:inherit;">
            <div class="product-card">
                {% if item.image %}
                    <img src="{{ item.image.url }}" alt="{{ item.name }}">
                {% endif %}
                <h2>{{ item.name }}</h2>
                <p>${{ item.price }}</p>
                <p>{{ item.category }}</p>
                <p>{% if item.in_stock %}In Stock{% else %}Out of Stock{% endif %}</p>
            </div>
        </a>
    {% endfor %}
</div>
{% endblock %}
