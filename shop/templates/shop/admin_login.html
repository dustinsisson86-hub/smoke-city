{% extends 'shop/base.html' %}
{% load static %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2>Admin Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="form-group">
                <label>Username</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label>Password</label>
                {{ form.password }}
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
